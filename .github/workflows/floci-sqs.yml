# Floci (AWS emulator): plan events on Amazon SQS – Hana Anwar (issue #26)
# Builds the AWS version of the database and IAM roles (infra/floci/setup.sh,
# Hana Fady), adds the plan-events queue (infra/floci/sqs/setup-sqs.sh), then
# runs the SQS tests end to end with the app's own code. No AWS account or
# secrets are needed: everything runs inside this job and is thrown away.
name: Floci – plan events on SQS

on:
  push:
    branches: [main]
    paths:
      - 'infra/floci/**'
      - 'backend/src/lib/planEvents.js'
      - 'backend/src/lib/sqs.js'
      - 'backend/scripts/plan-events-worker.js'
      - '.github/workflows/floci-sqs.yml'
  pull_request:
    paths:
      - 'infra/floci/**'
      - 'backend/src/lib/planEvents.js'
      - 'backend/src/lib/sqs.js'
      - 'backend/scripts/plan-events-worker.js'
      - '.github/workflows/floci-sqs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: floci-sqs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sqs:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test        # Floci's bootstrap credential, emulator only
      AWS_SECRET_ACCESS_KEY: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Tools and app dependencies
        run: |
          aws --version
          psql --version || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
          jq --version
          cd backend && npm ci --no-audit --no-fund

      - name: Start Floci with IAM policy enforcement
        run: |
          docker run -d --name floci -u root \
            -p 4566:4566 -p 7001-7020:7001-7020 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e FLOCI_SERVICES_IAM_ENFORCEMENT_ENABLED=true \
            -e FLOCI_SERVICES_RDS_PROXY_BASE_PORT=7001 \
            -e FLOCI_SERVICES_RDS_PROXY_MAX_PORT=7020 \
            -e FLOCI_SERVICES_RDS_ENDPOINT_HOST=localhost \
            floci/floci:2.5.0
          for i in $(seq 1 60); do
            aws sts get-caller-identity >/dev/null 2>&1 && break
            sleep 2
          done

      - name: Build RDS PostgreSQL + IAM roles (infra/floci/setup.sh)
        run: bash infra/floci/setup.sh

      - name: Build the plan-events queue (infra/floci/sqs/setup-sqs.sh)
        run: bash infra/floci/sqs/setup-sqs.sh

      - name: SQS tests (infra/floci/sqs/test-sqs.sh)
        run: bash infra/floci/sqs/test-sqs.sh

      - name: Results table
        if: always()
        run: cat infra/floci/.state/sqs-results.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Save results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: floci-sqs-results
          path: infra/floci/.state/sqs-results.md
          if-no-files-found: ignore

      - name: Floci log (on failure)
        if: failure()
        run: docker logs floci 2>&1 | tail -n 200
